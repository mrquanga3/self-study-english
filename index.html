<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>American English Pronunciation &amp; Reductions</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header>
    <div class="flag">🇺🇸</div>
    <h1>American English Pronunciation &amp; Reductions</h1>
    <p>Connected-speech listening practice — US, Indian &amp; Australian voices.</p>
    <p style="margin-top:14px;">
      <label for="voice" style="color:var(--muted);font-size:.85rem;">Voice / accent: </label>
      <select id="voice" class="control"></select>
    </p>
    <p style="margin-top:8px;">
      <label for="replay" style="color:var(--muted);font-size:.85rem;">Replay: </label>
      <select id="replay" class="control">
        <option value="off">Off (play once)</option>
        <option value="repeat">🔁 Repeat this part</option>
      </select>
    </p>
  </header>
  <main id="app"></main>
  <footer>
    Generated with Microsoft Edge neural TTS ·
    <a href="https://github.com/mrquanga3/self-study-english">source code on GitHub</a>
  </footer>

  <script src="js/transcripts.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
